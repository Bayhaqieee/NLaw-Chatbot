services:
  # ─── Frontend ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ─── Backend API ──────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - HF_API_TOKEN=${HF_API_TOKEN}
      - HF_MODEL_ID=bayhaqieee/qwen3.5-9b-nlaw-gguf
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - SEARXNG_URL=http://searxng:8080
      - COLLECTION_NAME=nusantara_law
    volumes:
      - ./UU-PDP:/app/documents:ro   # Mount law documents read-only
      - ./Model:/app/Model:ro        # Mount local models
      - ./Test-Set:/app/Test-Set:ro  # Mount test cases
      - ./eval_cache:/app/eval_cache # Persist evaluation results across rebuilds
    depends_on:
      - milvus-standalone
      - searxng

  # ─── Milvus Vector Database ───────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # ─── SearXNG (Web Search) ──────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  # ─── Vector Visualizer ──────────────────────────────────────
  vector-visualizer:
    build: ./vector_visualizer
    ports:
      - "8085:8085"
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - COLLECTION_NAME=nusantara_law
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - milvus-standalone

volumes:
  etcd_data:
  minio_data:
  milvus_data:
